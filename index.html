<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دفتر وکالت آقای [نام وکیل]</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg2:#111a2f;
      --card:#10192d;
      --card2:#15213a;
      --text:#f7f8fc;
      --muted:#b6bfd6;
      --gold:#d8b36a;
      --gold2:#f0d9a1;
      --line:rgba(255,255,255,.12);
      --shadow:0 18px 50px rgba(0,0,0,.35);
      --radius:24px;
      --radius2:16px;
      --container:1180px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(216,179,106,.12), transparent 28%),
        radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 22%),
        linear-gradient(180deg, #08101d 0%, #0b1220 45%, #09101a 100%);
      color:var(--text);
      line-height:1.9;
      overflow-x:hidden;
    }
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .container{width:min(100%, var(--container));margin:auto;padding:0 20px}
    section{padding:96px 0}
    .section-head{
      text-align:center;
      max-width:760px;
      margin:0 auto 42px;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:9px 16px;
      border:1px solid rgba(216,179,106,.28);
      background:rgba(216,179,106,.08);
      color:var(--gold2);
      border-radius:999px;
      font-size:13px;
      margin-bottom:16px;
    }
    .section-head h2{
      font-size:clamp(28px, 4vw, 44px);
      margin-bottom:10px;
    }
    .section-head p{
      color:var(--muted);
      font-size:16px;
    }
    .btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px;justify-content:flex-start}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 22px;
      border-radius:999px;
      font-weight:700;
      border:1px solid transparent;
      transition:.3s ease;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn-primary{
      background:linear-gradient(135deg, var(--gold), var(--gold2));
      color:#10131b;
      box-shadow:0 12px 30px rgba(216,179,106,.25);
    }
    .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.04)}
    .btn-ghost{
      border-color:rgba(255,255,255,.15);
      background:rgba(255,255,255,.03);
      color:var(--text);
    }
    .btn-ghost:hover{background:rgba(255,255,255,.07);transform:translateY(-2px)}

    header{
      position:sticky;top:0;z-index:1000;
      backdrop-filter:blur(18px);
      background:rgba(8,16,29,.72);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav{
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:-.2px;
    }
    .brand-mark{
      width:44px;height:44px;border-radius:14px;
      background:linear-gradient(135deg, var(--gold), #fff3cf);
      color:#10131b;
      display:grid;
      place-items:center;
      font-size:20px;
      box-shadow:0 10px 24px rgba(216,179,106,.22);
      flex:none;
    }
    .brand-text span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
    .nav-links{
      display:flex;
      align-items:center;
      gap:22px;
      color:var(--muted);
      font-size:15px;
    }
    .nav-links a{transition:.25s ease}
    .nav-links a:hover,.nav-links a.active{color:#fff}
    .nav-cta{display:flex;align-items:center;gap:12px}
    .menu-btn{
      display:none;
      width:46px;height:46px;border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:#fff;
      cursor:pointer;
    }

    .hero{
      padding:44px 0 18px;
    }
    .hero-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:28px;
      align-items:stretch;
    }
    .hero-copy{
      padding:28px 0;
    }
    .hero h1{
      font-size:clamp(34px, 5vw, 62px);
      line-height:1.15;
      margin:12px 0 16px;
    }
    .hero p{
      color:var(--muted);
      font-size:17px;
      max-width:640px;
    }
    .hero-points{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-top:26px;
    }
    .point{
      padding:16px;
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    .point strong{display:block;font-size:20px;color:var(--gold2);margin-bottom:4px}
    .hero-card{
      position:relative;
      min-height:620px;
      border-radius:34px;
      overflow:hidden;
      box-shadow:var(--shadow);
      background:
        linear-gradient(180deg, rgba(8,16,29,.05), rgba(8,16,29,.8)),
        url('https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1200&q=80') center/cover;
      border:1px solid rgba(255,255,255,.10);
    }
    .hero-card-inner{
      position:absolute;inset:auto 24px 24px 24px;
      padding:22px;
      border-radius:26px;
      background:rgba(10,16,28,.78);
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.10);
    }
    .hero-card-inner h3{font-size:24px;margin-bottom:8px}
    .hero-card-inner p{color:#d7deee;font-size:14px}
    .pill-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:rgba(216,179,106,.12);
      border:1px solid rgba(216,179,106,.18);
      color:#f7e5bf;
      font-size:13px;
    }

    .about{
      display:grid;
      grid-template-columns:.95fr 1.05fr;
      gap:28px;
      align-items:center;
    }
    .about-img{
      min-height:520px;
      border-radius:32px;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(8,16,29,.08), rgba(8,16,29,.68)),
        url('https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1200&q=80') center/cover;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.08);
    }
    .about-box{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:32px;
      padding:30px;
      box-shadow:var(--shadow);
    }
    .about-box h3{font-size:28px;margin-bottom:12px}
    .about-box p{color:var(--muted);margin-bottom:18px}
    .feature-list{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-top:22px;
    }
    .feature{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:16px;
    }
    .feature span{display:block;color:var(--gold2);font-weight:800;margin-bottom:6px}
    .feature p{font-size:14px;color:var(--muted);margin:0}

    .cards{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      border-radius:26px;
      padding:24px;
      box-shadow:var(--shadow);
      transition:.3s ease;
    }
    .card:hover{transform:translateY(-6px);border-color:rgba(216,179,106,.26)}
    .card .icon{
      width:54px;height:54px;border-radius:18px;
      background:rgba(216,179,106,.12);
      border:1px solid rgba(216,179,106,.18);
      display:grid;place-items:center;
      font-size:24px;
      margin-bottom:16px;
    }
    .card h3{margin-bottom:8px;font-size:20px}
    .card p{color:var(--muted);font-size:15px}

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }
    .stat{
      text-align:center;
      padding:26px 18px;
      border-radius:24px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    .stat strong{display:block;font-size:32px;color:var(--gold2);margin-bottom:6px}
    .stat span{color:var(--muted);font-size:14px}

    .testimonials{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
