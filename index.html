<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background: #34495e;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            padding: 20px;
            background: white;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .hero {
            text-align: center;
            padding: 50px 0;
        }
        .btn {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background: #2c3e50;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>به وب‌سایت من خوش آمدید</h1>
</header>

<nav>
    <a href="#">خانه</a>
    <a href="#">درباره ما</a>
    <a href="#">خدمات</a>
    <a href="#">تماس</a>
</nav>

<div class="container">
    <div class="hero">
        <h2>طراحی شده توسط GapGPT</h2>
        <p>این یک نمونه اولیه از سایت شماست. من می‌توانم بخش‌های مختلف آن را طبق سلیقه شما تغییر دهم.</p>
        <a href="#" class="btn">بیشتر بدانید</a>
    </div>
</div>

<footer>
    <p>تمامی حقوق محفوظ است © ۲۰۲۶</p>
</footer>

</body>
</html>
