<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر وکالت | مشاوره و دفاع حقوقی تخصصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
--navy:#080d1a;--navy-2:#0d1424;--navy-3:#111d30;--charcoal:#161e2e;--charcoal-2:#1c2536;
--gold:#c9a84c;--gold-l:#e2c97a;--gold-d:#a8893d;--gold-glow:rgba(201,168,76,.14);
--ivory:#f4eed8;--ivory-2:#e9e2cc;--cream:#f8f4eb;
--txt:#eee8d5;--txt-2:#9aa3b2;--txt-3:#5f6878;
--border:rgba(201,168,76,.13);--border-2:rgba(255,255,255,.055);
--r-sm:6px;--r-md:12px;--r-lg:20px;--r-xl:30px;
--sh-gold:0 6px 35px rgba(201,168,76,.18);
--sh-deep:0 30px 70px rgba(0,0,0,.55);
--sh-card:0 10px 40px rgba(0,0,0,.38);
--tr:.36s cubic-bezier(.4,0,.2,1);
--font:'Vazirmatn',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--font);background:var(--navy);color:var(--txt);direction:rtl;overflow-x:hidden;line-height:1.75}
::selection{background:var(--gold);color:var(--navy)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--navy)}
::-webkit-scrollbar-thumb{background:var(--gold-d);border-radius:3px}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;font-family:var(--font)}

body::before{
content:'';position:fixed;inset:0;
background:radial-gradient(ellipse 75% 55% at 75% 5%,rgba(201,168,76,.045) 0%,transparent 65%),
radial-gradient(ellipse 55% 45% at 5% 85%,rgba(201,168,76,.03) 0%,transparent 55%),
url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 0h1v1H8zM0 8h1v1H0zM56 0h1v1h-1zM0 56h1v1H0z' fill='%23c9a84c' fill-opacity='.018'/%3E%3C/svg%3E");
pointer-events:none;z-index:0}

.wrap{max-width:1200px;margin:0 auto;padding:0 2rem}
.section{position:relative;z-index:1}

.lbl{display:inline-flex;align-items:center;gap:.55rem;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1.1rem}
.lbl::before{content:'';width:22px;height:1px;background:var(--gold)}
.h2{font-size:clamp(1.75rem,3.2vw,2.7rem);font-weight:900;line-height:1.2;color:var(--ivory);margin-bottom:.9rem}
.sub{font-size:.98rem;color:var(--txt-2);line-height:1.85;max-width:500px}

.btn{display:inline-flex;align-items:center;gap:.55rem;padding:.82rem 1.9rem;border-radius:var(--r-sm);font-family:var(--font);font-size:.875rem;font-weight:700;transition:var(--tr);white-space:nowrap}
.btn-g{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-d) 100%);color:var(--navy);box-shadow:0 4px 22px rgba(201,168,76,.32)}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,168,76,.48)}
.btn-o{background:transparent;color:var(--txt);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.btn-o:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.055)}

.rv{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.rv.on{opacity:1;transform:none}
.rv-l{opacity:0;transform:translateX(35px);transition:opacity .65s ease,transform .65s ease}
.rv-l.on{opacity:1;transform:none}
.rv-r{opacity:0;transform:translateX(-35px);transition:opacity .65s ease,transform .65s ease}
.rv-r.on{opacity:1;transform:none}

/* ── HEADER ── */
#hdr{position:fixed;top:0;right:0;left:0;z-index:1000;padding:1.3rem 0;transition:var(--tr)}
#hdr.sc{background:rgba(6,10,20,.9);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);padding:.85rem 0;border-bottom:1px solid var(--border);box-shadow:0 4px 28px rgba(0,0,0,.35)}
.hdr-in{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:.85rem}
.logo-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-d) 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--navy);font-weight:900;box-shadow:0 4px 14px rgba(201,168,76,.28);flex-shrink:0;user-select:none}
.logo-tx{display:flex;flex-direction:column}
.logo-name{font-size:.95rem;font-weight:800;color:var(--ivory);line-height:1.2}
.logo-tag{font-size:.62rem;color:var(--gold);letter-spacing:.14em;font-weight:500}
nav ul{display:flex;align-items:center;gap:.2rem;list-style:none}
nav ul li a{position:relative;padding:.48rem .8rem;font-size:.82rem;font-weight:500;color:var(--txt-2);transition:color .3s}
nav ul li a::after{content:'';position:absolute;bottom:0;right:.8rem;left:.8rem;height:1.5px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .32s ease}
nav ul li a:hover,nav ul li a.act{color:var(--ivory)}
nav ul li a:hover::after,nav ul li a.act::after{transform:scaleX(1)}
.hdr-r{display:flex;align-items:center;gap:.75rem}
.hdr-r .btn{padding:.55rem 1.3rem;font-size:.8rem}

.burger{display:none;flex-direction:column;gap:5px;background:none;padding:5px;z-index:1001}
.burger span{display:block;width:23px;height:2px;background:var(--ivory);border-radius:2px;transition:var(--tr);transform-origin:center}
.burger.op span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.op span:nth-child(2){opacity:0;transform:scaleX(0)}
.burger.op span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.mob-menu{position:fixed;top:0;right:0;width:min(370px,100vw);height:100vh;background:rgba(6,10,20,.97);backdrop-filter:blur(28px);z-index:999;transform:translateX(100%);transition:transform .44s cubic-bezier(.4,0,.2,1);padding:6.5rem 2.5rem 2.5rem;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.mob-menu.op{transform:translateX(0)}
.mob-menu ul{list-style:none;flex:1}
.mob-menu ul li{border-bottom:1px solid rgba(255,255,255,.035);opacity:0;transform:translateX(18px);transition:var(--tr)}
.mob-menu.op ul li{opacity:1;transform:none}
.mob-menu.op ul li:nth-child(1){transition-delay:.08s}
.mob-menu.op ul li:nth-child(2){transition-delay:.13s}
.mob-menu.op ul li:nth-child(3){transition-delay:.18s}
.mob-menu.op ul li:nth-child(4){transition-delay:.23s}
.mob-menu.op ul li:nth-child(5){transition-delay:.28s}
.mob-menu.op ul li:nth-child(6){transition-delay:.33s}
.mob-menu.op ul li:nth-child(7){transition-delay:.38s}
.mob-menu.op ul li:nth-child(8){transition-delay:.43s}
.mob-menu ul li a{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;font-size:1rem;font-weight:600;color:var(--txt);transition:color .3s}
.mob-menu ul li a:hover{color:var(--gold)}
.mob-menu ul li a em{font-style:normal;font-size:.68rem;color:var(--gold);opacity:.55}
.mob-foot{margin-top:auto;display:flex;flex-direction:column;gap:.75rem}
.mob-foot .btn{justify-content:center}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:998;opacity:0;pointer-events:none;transition:opacity .4s}
.ovl.op{opacity:1;pointer-events:all}

/* ── HERO ── */
#home{min-height:100vh;display:flex;align-items:center;padding:8rem 0 5rem;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 65% 65% at 80% 50%,rgba(201,168,76,.055) 0%,transparent 60%),radial-gradient(ellipse 55% 80% at 15% 20%,rgba(201,168,76,.038) 0%,transparent 55%),linear-gradient(155deg,#0e1628 0%,#080d1a 50%,#060a14 100%);z-index:0}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;align-items:center}
.hero-bdg{display:inline-flex;align-items:center;gap:.55rem;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.22);border-radius:50px;padding:.4rem 1rem;font-size:.72rem;font-weight:700;color:var(--gold-l);margin-bottom:1.6rem;letter-spacing:.05em}
.hero-bdg-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pdot 2.2s infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.65)}}
.hero-ttl{font-size:clamp(2rem,4.5vw,3.5rem);font-weight:900;line-height:1.15;color:var(--ivory);margin-bottom:1.3rem}
.hero-ttl .hl{display:block;background:linear-gradient(130deg,var(--gold-l) 0%,var(--gold) 50%,var(--gold-d) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{font-size:.98rem;color:var(--txt-2);line-height:1.9;margin-bottom:2.2rem;max-width:460px}
.hero-act{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin-bottom:2.8rem}
.hero-stats{display:flex;gap:1.8rem;padding-top:1.8rem;border-top:1px solid var(--border);flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:1.5rem;font-weight:800;color:var(--gold);line-height:1}
.hstat-l{font-size:.68rem;color:var(--txt-3);margin-top:.28rem;font-weight:500}

.hero-vis{position:relative;display:flex;justify-content:center}
.hero-frame{position:relative;width:100%;max-width:490px}
.hero-frame::before{content:'';position:absolute;top:-18px;left:-18px;right:18px;bottom:18px;border:1px solid rgba(201,168,76,.14);border-radius:var(--r-xl);z-index:0}
.hero-frame::after{content:'';position:absolute;top:18px;right:-18px;left:18px;bottom:-18px;background:linear-gradient(135deg,rgba(201,168,76,.07) 0%,transparent 65%);border-radius:var(--r-xl);z-index:0}
.hero-img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-deep)}
.hero-img img{width:100%;height:100%;object-fit:cover;filter:brightness(.82) contrast(1.06) saturate(.9);transition:transform 8s ease}
.hero-img:hover img{transform:scale(1.04)}
.hero-img-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,13,26,.65) 100%)}

.hero-fc{position:absolute;bottom:-1.2rem;right:-1.2rem;z-index:3;background:rgba(10,16,30,.92);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-md);padding:1.1rem 1.5rem;box-shadow:var(--sh-gold);min-width:175px}
.fc-row{display:flex;align-items:center;gap:.65rem;margin-bottom:.45rem}
.fc-row:last-child{margin-bottom:0}
.fc-ico{width:30px;height:30px;background:var(--gold-glow);border:1px solid rgba(201,168,76,.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.fc-lbl{font-size:.62rem;color:var(--txt-3);font-weight:500}
.fc-val{font-size:.82rem;font-weight:700;color:var(--ivory)}

.hero-cbdg{position:absolute;top:1.5rem;left:-.8rem;z-index:3;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-d) 100%);color:var(--navy);border-radius:var(--r-md);padding:.85rem 1rem;text-align:center;box-shadow:0 8px 24px rgba(201,168,76,.38)}
.hero-cbdg .cn{font-size:1.45rem;font-weight:900;display:block;line-height:1}
.hero-cbdg .ct{font-size:.62rem;font-weight:700;opacity:.85;margin-top:.1rem}

/* ── ABOUT ── */
#about{padding:7rem 0;position:relative}
#about::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent);opacity:.25}
.about-in{display:grid;grid-template-columns:1fr 1fr;gap:4.5rem;align-items:center}
.about-vis{position:relative}
.about-iw{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:3/4;box-shadow:var(--sh-deep)}
.about-iw img{width:100%;height:100%;object-fit:cover;filter:brightness(.72) saturate(.88)}
.about-io{position:absolute;inset:0;background:linear-gradient(160deg,rgba(201,168,76,.07) 0%,rgba(8,13,26,.55) 65%)}
.about-ac{position:absolute;top:3rem;right:-1.8rem;width:1px;height:55%;background:linear-gradient(180deg,transparent,var(--gold-d),transparent);opacity:.28}
.about-qb{position:absolute;bottom:1.8rem;right:1.4rem;left:1.4rem;background:rgba(8,13,26,.9);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-md);padding:1.2rem;box-shadow:var(--sh-gold)}
.qm{font-size:2.2rem;color:var(--gold);line-height:.75;opacity:.55;font-family:Georgia,serif}
.qt{font-size:.82rem;color:var(--txt-2);line-height:1.75;margin:.45rem 0 .75rem;font-style:italic}
.qa{font-size:.72rem;color:var(--gold);font-weight:700}

.about-vals{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:2.2rem}
.val-it{display:flex;align-items:flex-start;gap:.85rem;padding:1rem;background:rgba(255,255,255,.018);border:1px solid var(--border-2);border-radius:var(--r-md);transition:var(--tr)}
.val-it:hover{background:rgba(201,168,76,.038);border-color:var(--border)}
.val-ico{width:34px;height:34px;background:var(--gold-glow);border:1px solid rgba(201,168,76,.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;margin-top:.05rem}
.val-tt{font-size:.82rem;font-weight:700;color:var(--ivory);margin-bottom:.15rem}
.val-ds{font-size:.72rem;color:var(--txt-3);line-height:1.6}

.about-cred{display:flex;gap:1.4rem;margin-top:1.8rem;flex-wrap:wrap}
.cr-it{display:flex;align-items:center;gap:.45rem;font-size:.75rem;color:var(--txt-2);font-weight:500}
.cr-it::before{content:'';width:18px;height:1px;background:var(--gold);flex-shrink:0}

/* ── SERVICES ── */
#services{padding:7rem 0}
.svcs-hdr{text-align:center;margin-bottom:3.5rem}
.svcs-hdr .sub{margin:0 auto;text-align:center}
.svcs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;background:rgba(201,168,76,.1);border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(201,168,76,.1);box-shadow:var(--sh-card)}
.svc-card{background:var(--charcoal-2);padding:2.3rem 2rem;position:relative;transition:var(--tr);overflow:hidden}
.svc-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.06) 0%,transparent 55%);opacity:0;transition:opacity .4s}
.svc-card:hover::before{opacity:1}
.svc-card::after{content:'';position:absolute;bottom:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .4s}
.svc-card:hover::after{opacity:1}
.svc-card:hover{background:#1e2737}
.svc-ico{width:48px;height:48px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.14);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:1.3rem;transition:var(--tr)}
.svc-card:hover .svc-ico{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.3);transform:scale(1.07)}
.svc-tt{font-size:.95rem;font-weight:800;color:var(--ivory);margin-bottom:.6rem;transition:color .3s}
.svc-card:hover .svc-tt{color:var(--gold-l)}
.svc-ds{font-size:.78rem;color:var(--txt-3);line-height:1.75;transition:color .3s}
.svc-card:hover .svc-ds{color:var(--txt-2)}
.svc-arr{position:absolute;bottom:1.5rem;left:1.5rem;font-size:.85rem;color:var(--gold);opacity:0;transform:translateX(-6px);transition:var(--tr)}
.svc-card:hover .svc-arr{opacity:1;transform:none}

/* ── SPECIALTIES ── */
#spec{padding:7rem 0;position:relative}
#spec::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent);opacity:.2}
.spec-in{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center}
.spec-list{display:flex;flex-direction:column;gap:.9rem;margin-top:2rem}
.spec-it{display:flex;align-items:flex-start;gap:1.1rem;padding:1.4rem 1.6rem;background:rgba(255,255,255,.016);border:1px solid var(--border-2);border-radius:var(--r-md);transition:var(--tr);position:relative;overflow:hidden}
.spec-it::before{content:'';position:absolute;right:0;top:0;width:2px;height:100%;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .4s}
.spec-it:hover{background:rgba(201,168,76,.04);border-color:var(--border);transform:translateX(-4px)}
.spec-it:hover::before{opacity:1}
.spec-n{width:38px;height:38px;background:var(--gold-glow);border:1px solid rgba(201,168,76,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem;font-weight:800;color:var(--gold);font-family:Georgia,serif}
.spec-tt{font-size:.9rem;font-weight:700;color:var(--ivory);margin-bottom:.25rem}
.spec-ds{font-size:.75rem;color:var(--txt-3);line-height:1.65}
.spec-vis{position:relative}
.spec-img-w{border-radius:var(--r-xl);overflow:hidden;aspect-ratio:1/1;box-shadow:var(--sh-deep);position:relative}
.spec-img-w img{width:100%;height:100%;object-fit:cover;filter:brightness(.7) saturate(.85)}
.spec-img-w::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(201,168,76,.08) 0%,rgba(8,13,26,.5) 100%)}
.spec-overlay{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);width:calc(100% - 3rem);background:rgba(8,13,26,.88);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-md);padding:1.4rem;box-shadow:var(--sh-gold);text-align:center}
.spec-ov-tt{font-size:1rem;font-weight:800;color:var(--gold);margin-bottom:.4rem}
.spec-ov-ds{font-size:.75rem;color:var(--txt-2);line-height:1.65}

/* ── METRICS ── */
#metrics{padding:7rem 0;position:relative;overflow:hidden}
.metrics-bg{position:absolute;inset:0;background:linear-gradient(160deg,#0e1628 0%,#0a0f1e 100%)}
.metrics-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(201,168,76,.05) 0%,transparent 60%)}
.metrics-hdr{text-align:center;margin-bottom:4rem;position:relative;z-index:1}
.metrics-hdr .sub{margin:0 auto;text-align:center}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5px;background:rgba(201,168,76,.12);border-radius:var(--r-lg);border:1px solid rgba(201,168,76,.12);overflow:hidden;position:relative;z-index:1;box-shadow:var(--sh-deep)}
.m-cell{background:rgba(14,22,40,.9);padding:3rem 1.5rem;text-align:center;position:relative;overflow:hidden;transition:var(--tr)}
.m-cell::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.25),transparent)}
.m-cell:hover{background:rgba(18,28,48,.95)}
.m-ico{font-size:1.8rem;margin-bottom:1rem;display:block}
.m-num{font-size:clamp(2.2rem,4vw,3.2rem);font-weight:900;color:var(--gold);line-height:1;margin-bottom:.5rem;font-variant-numeric:tabular-nums}
.m-suf{font-size:1.4rem;color:var(--gold-d)}
.m-lbl{font-size:.78rem;color:var(--txt-2);font-weight:500;line-height:1.5}

/* ── TESTIMONIALS ── */
#tst{padding:7rem 0}
.tst-hdr{text-align:center;margin-bottom:3.5rem}
.tst-hdr .sub{margin:0 auto;text-align:center}
.tst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.tst-card{background:var(--charcoal-2);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:2rem;position:relative;overflow:hidden;transition:var(--tr)}
.tst-card::before{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .4s}
.tst-card:hover::before{opacity:1}
.tst-card:hover{border-color:var(--border);background:#1e2636;transform:translateY(-4px);box-shadow:var(--sh-card)}
.tst-qico{font-size:2.5rem;color:var(--gold);opacity:.3;font-family:Georgia,serif;line-height:.8;margin-bottom:1rem}
.tst-stars{display:flex;gap:.2rem;margin-bottom:1rem}
.tst-stars span{color:var(--gold);font-size:.85rem}
.tst-txt{font-size:.83rem;color:var(--txt-2);line
