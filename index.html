<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر وکالت آقای [نام وکیل] | مشاوره حقوقی تخصصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a0f1e;
  --navy-mid: #111827;
  --navy-light: #1a2540;
  --charcoal: #1e2535;
  --charcoal-light: #2d3748;
  --gold: #c9a84c;
  --gold-light: #e2c27a;
  --gold-dim: #a8893d;
  --gold-glow: rgba(201,168,76,0.15);
  --ivory: #f5f0e8;
  --ivory-dim: #e8e2d6;
  --white: #ffffff;
  --text-primary: #f0ebe0;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --border: rgba(201,168,76,0.15);
  --border-light: rgba(255,255,255,0.06);
  --glass-bg: rgba(10,15,30,0.75);
  --glass-border: rgba(201,168,76,0.12);
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 32px;
  --shadow-gold: 0 4px 30px rgba(201,168,76,0.12);
  --shadow-deep: 0 25px 60px rgba(0,0,0,0.5);
  --shadow-card: 0 8px 32px rgba(0,0,0,0.35);
  --transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  --font: 'Vazirmatn', 'IRANSansX', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: var(--font);
  background: var(--navy);
  color: var(--text-primary);
  direction: rtl;
  overflow-x: hidden;
  line-height: 1.7;
}

::selection { background: var(--gold); color: var(--navy); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--navy); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

/* ─── BACKGROUND TEXTURE ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 70% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 0% 80%, rgba(201,168,76,0.03) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* ─── UTILITY ─── */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem;
}

.section { position: relative; z-index: 1; }

.gold-text { color: var(--gold); }

.section-label {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.2rem;
}
.section-label::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--gold);
  display: block;
}

.section-title {
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 800;
  line-height: 1.25;
  color: var(--ivory);
  margin-bottom: 1rem;
}

.section-subtitle {
  font-size: 1rem;
  color: var(--text-secondary);
  max-width: 520px;
  line-height: 1.8;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.85rem 2rem;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: var(--transition);
  text-decoration: none;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  color: var(--navy);
  box-shadow: 0 4px 20px rgba(201,168,76,0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(201,168,76,0.45);
}

.btn-outline {
  background: transparent;
  color: var(--ivory);
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
}
.btn-outline:hover {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(201,168,76,0.06);
}

/* ─── REVEAL ANIMATION ─── */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-left {
  opacity: 0;
  transform: translateX(40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-left.visible {
  opacity: 1;
  transform: translateX(0);
}
.reveal-right {
  opacity: 0;
  transform: translateX(-40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-right.visible {
  opacity: 1;
  transform: translateX(0);
}

/* ─── HEADER ─── */
#header {
  position: fixed;
  top: 0;
  right: 0;
  left: 0;
  z-index: 1000;
  padding: 1.4rem 0;
  transition: var(--transition);
}
#header.scrolled {
  background: rgba(8,12,24,0.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  text-decoration: none;
}
.logo-mark {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: var(--navy);
  font-weight: 900;
  box-shadow: 0 4px 15px rgba(201,168,76,0.25);
  flex-shrink: 0;
}
.logo-text {
  display: flex;
  flex-direction: column;
}
.logo-name {
  font-size: 1rem;
  font-weight: 800;
  color: var(--ivory);
  line-height: 1.2;
}
.logo-tagline {
  font-size: 0.68rem;
  color: var(--gold);
  letter-spacing: 0.12em;
  font-weight: 500;
}

nav ul {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  list-style: none;
}
nav ul li a {
  position: relative;
  padding: 0.5rem 0.85rem;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.3s ease;
  white-space: nowrap;
}
nav ul li a::after {
  content: '';
  position: absolute;
  bottom: 0;
  right: 50%;
  left: 50%;
  height: 1.5px;
  background: var(--gold);
  transition: right 0.3s ease, left 0.3s ease;
  border-radius: 2px;
}
nav ul li a:hover,
nav ul li a.active {
  color: var(--ivory);
}
nav ul li a:hover::after,
nav ul li a.active::after {
  right: 0.85rem;
  left: 0.85rem;
}

.header-cta {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.header-cta .btn {
  padding: 0.6rem 1.4rem;
  font-size: 0.82rem;
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  z-index: 1001;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--ivory);
  border-radius: 2px;
  transition: var(--transition);
  transform-origin: center;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile Menu */
.mobile-menu {
  position: fixed;
  top: 0;
  right: 0;
  width: min(380px, 100vw);
  height: 100vh;
  background: rgba(8,12,24,0.97);
  backdrop-filter: blur(30px);
  z-index: 999;
  transform: translateX(100%);
  transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
  padding: 7rem 2.5rem 2.5rem;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu ul { list-style: none; flex: 1; }
.mobile-menu ul li {
  border-bottom: 1px solid rgba(255,255,255,0.04);
  opacity: 0;
  transform: translateX(20px);
  transition: var(--transition);
}
.mobile-menu.open ul li {
  opacity: 1;
  transform: translateX(0);
}
.mobile-menu.open ul li:nth-child(1) { transition-delay: 0.1s; }
.mobile-menu.open ul li:nth-child(2) { transition-delay: 0.15s; }
.mobile-menu.open ul li:nth-child(3) { transition-delay: 0.2s; }
.mobile-menu.open ul li:nth-child(4) { transition-delay: 0.25s; }
.mobile-menu.open ul li:nth-child(5) { transition-delay: 0.3s; }
.mobile-menu.open ul li:nth-child(6) { transition-delay: 0.35s; }
.mobile-menu.open ul li:nth-child(7) { transition-delay: 0.4s; }
.mobile-menu.open ul li:nth-child(8) { transition-delay: 0.45s; }
.mobile-menu ul li a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 0;
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--text-primary);
  text-decoration: none;
  transition: color 0.3s;
}
.mobile-menu ul li a:hover { color: var(--gold); }
.mobile-menu ul li a span { font-size: 0.7rem; color: var(--gold); opacity: 0.6; }
.mobile-menu-footer { margin-top: auto; }
.mobile-menu-footer .btn { width: 100%; justify-content: center; margin-bottom: 0.8rem; }
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 998;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.overlay.open { opacity: 1; pointer-events: all; }

/* ─── HERO ─── */
#home {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 8rem 0 5rem;
  position: relative;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 70% at 80% 50%, rgba(201,168,76,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 80% at 20% 20%, rgba(201,168,76,0.04) 0%, transparent 50%),
    linear-gradient(160deg, #0d1426 0%, #0a0f1e 50%, #080c18 100%);
  z-index: 0;
}

.hero-line {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 45%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.15) 30%, rgba(201,168,76,0.05) 100%);
  z-index: 0;
}

.hero-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 50px;
  padding: 0.45rem 1.1rem;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--gold-light);
  margin-bottom: 1.8rem;
  letter-spacing: 0.05em;
}
.hero-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}

.hero-title {
  font-size: clamp(2.2rem, 5vw, 3.8rem);
  font-weight: 900;
  line-height: 1.15;
  color: var(--ivory);
  margin-bottom: 1.4rem;
}
.hero-title .highlight {
  display: block;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-desc {
  font-size: 1.02rem;
  color: var(--text-secondary);
  line-height: 1.9;
  margin-bottom: 2.4rem;
  max-width: 480px;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 3rem;
}

.hero-stats {
  display: flex;
  gap: 2rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}
.hero-stat-item {
  display: flex;
  flex-direction: column;
}
.hero-stat-num {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--gold);
  line-height: 1;
}
.hero-stat-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
  font-weight: 500;
}

/* Hero Image Side */
.hero-visual {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.hero-img-frame {
  position: relative;
  width: 100%;
  max-width: 500px;
}
.hero-img-frame::before {
  content: '';
  position: absolute;
  top: -20px;
  left: -20px;
  right: 20px;
  bottom: 20px;
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: var(--radius-xl);
  z-index: 0;
}
.hero-img-frame::after {
  content: '';
  position: absolute;
  top: 20px;
  right: -20px;
  left: 20px;
  bottom: -20px;
  background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 70%);
  border-radius: var(--radius-xl);
  z-index: 0;
}

.hero-img {
  position: relative;
  z-index: 1;
  width: 100%;
  aspect-ratio: 4/5;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-deep);
}
.hero-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.85) contrast(1.05);
}
.hero-img-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(10,15,30,0.6) 100%);
}

.hero-floating-card {
  position: absolute;
  bottom: -1.5rem;
  right: -1.5rem;
  z-index: 3;
  background: rgba(12,18,32,0.9);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.2rem 1.6rem;
  box-shadow: var(--shadow-gold);
  min-width: 180px;
}
.floating-card-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  margin-bottom: 0.5rem;
}
.floating-card-row:last-child { margin-bottom: 0; }
.fc-icon {
  width: 32px;
  height: 32px;
  background: var(--gold-glow);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.fc-info {
  display: flex;
  flex-direction: column;
}
.fc-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 500; }
.fc-value { font-size: 0.85rem; font-weight: 700; color: var(--ivory); }

.hero-corner-badge {
  position: absolute;
  top: 1.5rem;
  left: -1rem;
  z-index: 3;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  color: var(--navy);
  border-radius: var(--radius-md);
  padding: 0.9rem 1.1rem;
  text-align: center;
  box-shadow: 0 8px 25px rgba(201,168,76,0.35);
}
.hero-corner-badge .num { font-size: 1.5rem; font-weight: 900; display: block; line-height: 1; }
.hero-corner-badge .text { font-size: 0.65rem; font-weight: 600; opacity: 0.85; }

/* ─── ABOUT ─── */
#about {
  padding: 7rem 0;
  position: relative;
}
.about-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
}
.about-visual {
  position: relative;
}
.about-img-wrap {
  position: relative;
  border-radius: var(--radius-xl);
  overflow: hidden;
  aspect-ratio: 3/4;
  box-shadow: var(--shadow-deep);
}
.about-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.75) saturate(0.9);
}
.about-img-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(201,168,76,0.08) 0%, rgba(10,15,30,0.5) 70%);
}
.about-quote-box {
  position: absolute;
  bottom: 2rem;
  right: 1.5rem;
  left: 1.5rem;
  background: rgba(10,15,30,0.88);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.3rem;
  box-shadow: var(--shadow-gold);
}
.quote-mark { font-size: 2.5rem; color: var(--gold); line-height: 0.8; opacity: 0.6; font-family: Georgia, serif; }
.quote-text {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin: 0.5rem 0 0.8rem;
  font-style: italic;
}
.quote-author { font-size: 0.75rem; color: var(--gold); font-weight: 700; }

.about-accent-line {
  position: absolute;
  top: 3rem;
  right: -2rem;
  width: 1px;
  height: 60%;
  background: linear-gradient(180deg, transparent, var(--gold-dim), transparent);
  opacity: 0.3;
}

.about-values {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 2.5rem;
}
.value-item {
  display: flex;
  align-items: flex-start;
  gap: 0.9rem;
  padding: 1.1rem;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  transition: var(--transition);
}
.value-item:hover {
  background: rgba(201,168,76,0.04);
  border-color: var(--border);
}
.value-icon {
  width: 36px;
  height: 36px;
  background: var(--gold-glow);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  margin-top: 0.1rem;
}
.value-title { font-size: 0.85rem; font-weight: 700; color: var(--ivory); margin-bottom: 0.2rem; }
.value-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; }

.about-credentials {
  display: flex;
  gap: 1.5rem;
  margin-top: 2rem;
  flex-wrap: wrap;
}
.cred-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.78rem;
  color: var(--text-secondary);
  font-weight: 500;
}
.cred-item::before {
  content: '';
  width: 20px;
  height: 1px;
  background: var(--gold);
  flex-shrink: 0;
}

/* ─── SERVICES ─── */
#services {
  padding: 7rem 0;
  position: relative;
}
.services-header {
  text-align: center;
  margin-bottom: 4rem;
}
.services-header .section-subtitle {
  margin: 0 auto;
  text-align: center;
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5px;
  background: var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}

.service-card {
  background: var(--charcoal);
  padding: 2.5rem 2rem;
  position: relative;
  transition: var(--transition);
  overflow: hidden;
  cursor: pointer;
}
.service-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(201,168,76,0.06) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.service-card:hover::before { opacity: 1; }
.service-card:hover { background: #202736; }

.service-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  right: 0;
  left: 0;
  height: 2px;
