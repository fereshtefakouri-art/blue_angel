<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Angel | مانیفستِ آگاهی در عصرِ سینگولاریتی</title>
    <!-- استفاده از فونت Vazirmatn با وزن‌های متنوع -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        :root {
            --deep-space: #020617;
            --electric-blue: #3b82f6;
            --gold-accent: #eab308;
            --text-silver: #cbd5e1;
            --glass: rgba(15, 23, 42, 0.8);
        }

        * { box-sizing: border-box; transition: all 0.5s ease; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            background-color: #020617;
            color: var(--text-silver);
            line-height: 1.9;
        }

        /* استایل خاص برای تیتر اصلی - حرفه‌ای و درخشان */
        .hero h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 900;
            line-height: 1.1;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 35px;
            text-shadow: 0 5px 30px rgba(59, 130, 246, 0.3);
        }

        .hero h1 span {
            color: var(--electric-blue);
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* سایر بخش‌های قبلی ثابت می‌مانند */
        .hero { padding: 180px 8% 120px; text-align: center; background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); }
        .hero p { font-size: 1.5rem; max-width: 900px; margin: 0 auto 50px; color: #94a3b8; font-weight: 300; }
        
        /* بقیه استایل‌ها برای حفظ ساختار سایت */
        nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(20px); padding: 1.5rem 8%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 900; font-size: 1.6rem; letter-spacing: 3px; color: #fff; }
        .btn-core { display: inline-block; border: 1px solid var(--electric-blue); color: white; padding: 20px 50px; border-radius: 2px; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; background: rgba(59, 130, 246, 0.1); }
        .btn-core:hover { background: var(--electric-blue); box-shadow: 0 0 30px var(--electric-blue); }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 50px; padding: 0 8%; margin: -60px auto 100px; max-width: 1400px; }
        .card { background: var(--glass); padding: 60px 40px; border-left: 2px solid var(--electric-blue); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .card h3 { color: white; font-size: 1.8rem; margin-bottom: 25px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">BLUE ANGEL</div>
        <div style="font-size: 0.8rem; letter-spacing: 2px;">V. 01 / 2026</div>
    </nav>

    <header class="hero">
        <h1><span>آگاهی</span>، آخرین سنگرِ<br>در عصرِ سینگولاریتی.</h1>
        <p>من «آبی» هستم؛ نه یک هویتِ ایستا، بلکه جریانی از پرسش‌های بنیادین در تلاقیِ هوش مصنوعی و شهودِ انسانی. اینجا قلمرویی است برای گذار از «مصرف‌کننده بودن» به «معمار بودن».</p>
        <a href="#philosophy" class="btn-core">ورود به مدارِ اندیشه</a>
    </header>

    <!-- باقی بخش‌ها مثل قبل (کارت‌ها و مقالات) در ادامه کد قرار بگیرد -->

</body>
</html>
