<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سالن زیبایی رزگلد</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Tahoma,sans-serif;
    }

    body{
      background:#fff8fb;
      color:#4b2e39;
      line-height:1.8;
    }

    html{
      scroll-behavior:smooth;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:90%;
      max-width:1200px;
      margin:auto;
    }

    header{
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 2px 15px rgba(0,0,0,0.05);
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 0;
    }

    .logo{
      font-size:26px;
      font-weight:bold;
      color:#c97d93;
    }

    .nav-links{
      display:flex;
      gap:22px;
      list-style:none;
    }

    .nav-links a{
      color:#4b2e39;
      font-size:15px;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#c97d93;
    }

    .hero{
      min-height:90vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:
        linear-gradient(rgba(255,248,251,0.65), rgba(255,248,251,0.65)),
        url('https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      padding:60px 20px;
    }

    .hero-content{
      background:rgba(255,255,255,0.72);
      padding:40px;
      border-radius:24px;
      max-width:800px;
      box-shadow:0 10px 35px rgba(0,0,0,0.08);
    }

    .hero h1{
      font-size:48px;
      color:#b76b82;
      margin-bottom:18px;
    }

    .hero p{
      font-size:18px;
      color:#6f4f5c;
      margin-bottom:25px;
    }

    .btn{
      display:inline-block;
      padding:14px 28px;
      border-radius:30px;
      background:linear-gradient(45deg,#d99cad,#d4af37);
      color:white;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 20px rgba(0,0,0,0.1);
    }

    section{
      padding:80px 0;
    }

    .section-title{
      text-align:center;
      font-size:36px;
      color:#b76b82;
      margin-bottom:15px;
    }

    .section-subtitle{
      text-align:center;
      color:#7b5c68;
      max-width:700px;
      margin:0 auto 40px;
    }

    .about-box{
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 8px 25px rgba(0,0,0,0.05);
      text-align:center;
    }

    .services-grid,
    .gallery-grid,
    .pricing-grid,
    .reviews-grid{
      display:grid;
      gap:22px;
    }

    .services-grid{
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    }

    .service-card{
      background:white;
      padding:28px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 8px 25px rgba(0,0,0,0.05);
      transition:0.3s;
    }

    .service-card:hover{
      transform:translateY(-8px);
    }

    .service-card .icon{
      font-size:34px;
      margin-bottom:12px;
    }
