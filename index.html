<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سالن زیبایی [نام سالن]</title>
  <style>
    :root {
      --bg: #fff7fb;
      --card: rgba(255, 255, 255, 0.82);
      --text: #4d2f3a;
      --muted: #7a5a68;
      --pink: #d99cad;
      --pink-dark: #b96b80;
      --gold: #d4af37;
      --gold-soft: #f4e5b7;
      --shadow: 0 18px 45px rgba(140, 90, 110, 0.12);
      --radius: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(217, 156, 173, 0.14), transparent 28%),
        radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.10), transparent 24%),
        var(--bg);
      color: var(--text);
      line-height: 1.9;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .section {
      padding: 92px 0;
    }

    .section-title {
      text-align: center;
      font-size: clamp(28px, 4vw, 40px);
      color: var(--pink-dark);
      margin-bottom: 12px;
    }

    .section-subtitle {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 42px;
      color: var(--muted);
      font-size: 16px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 999;
      background: rgba(255, 247, 251, 0.72);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(217, 156, 173, 0.14);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      gap: 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: var(--pink-dark);
      white-space: nowrap;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--pink), var(--gold));
      color: white;
      box-shadow: 0 10px 24px rgba(212, 175, 55, 0.22);
      font-size: 20px;
    }

    nav ul {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      font-size: 15px;
      position: relative;
      transition: 0.3s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--pink), var(--gold));
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: var(--pink-dark);
    }

    nav a:hover::after {
      width: 100%;
    }

    .menu-toggle {
      display: none;
      font-size: 30px;
      cursor: pointer;
      color: var(--pink-dark);
      background: none;
      border: none;
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 60px 0;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255, 245, 248, 0.72), rgba(255, 255, 255, 0.38)),
        url("https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
      filter: saturate(1.03);
      transform: scale(1.02);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,0,0.12));
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(960px, 92%);
      text-align: center;
      padding: 46px 34px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--pink-dark);
      border: 1px solid rgba(217, 156, 173, 0.18);
      margin-bottom: 20px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1.2;
      color: #9f546a;
      margin-bottom: 18px;
    }

    .hero p {
      max-width: 760px;
      margin: 0 auto 28px;
      color: #6f5360;
      font-size: 17px;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s ease;
      box-shadow: 0 12px 28px rgba(217, 156, 173, 0.24);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--gold));
    }

    .btn-secondary {
      color: var(--pink-dark);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(217, 156, 173, 0.20);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 30px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(217, 156, 173, 0.14);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stat strong {
      display: block;
      font-size: 26px;
      color: var(--pink-dark);
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 14px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(217, 156, 173, 0.12);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      transition: 0.35s ease;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card h3 {
      color: var(--pink-dark);
      margin-bottom: 12px;
      font-size: 20px;
    }

    .card p {
      color: var(--muted);
      font-size: 15px;
    }

    .service-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(217, 156, 173, 0.18), rgba(212, 175, 55, 0.18));
      color: var(--pink-dark);
      font-size: 24px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      box-shadow: var(--shadow);
      min-height: 240px;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .g1 { grid-column: span 5; }
    .g2 { grid-column: span 4; }
    .g3 { grid-column: span 3; }
    .g4 { grid-column: span 6; }
    .g5 { grid-column: span 6; }

    .pricing-box {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(217, 156, 173, 0.12);
      overflow: hidden;
    }

    .pricing-header {
      padding: 24px;
      background: linear-gradient(135deg, rgba(217, 156, 173, 0.12), rgba(212, 175, 55, 0.10));
      text-align: center;
    }

    .pricing-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      padding: 22px;
    }

    .price-item {
      background: white;
      border: 1px solid rgba(217, 156, 173, 0.12);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .price-item h4 {
      color: var(--pink-dark);
      margin-bottom: 10px;
      font-size: 18px;
    }

    .price-item .amount {
      color: var(--gold);
      font-weight: 700;
      font-size: 20px;
      margin-top: 10px;
    }

    .reviews {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }

    .review {
      position: relative;
      padding-top: 34px;
    }

    .review::before {
      content: "❝";
      position: absolute;
      top: 0;
      right: 18px;
      font-size: 54px;
      color: rgba(212, 175, 55, 0.22);
      line-height: 1;
    }

    .review .name {
      margin-top: 16px;
      color: var(--gold);
      font-weight: 700;
    }

    .booking {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .booking-info,
    .booking-form {
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(217, 156, 173, 0.12);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .booking-info h3,
    .booking-form h3 {
      color: var(--pink-dark);
      margin-bottom: 14px;
      font-size: 24px;
    }

    .booking-info p {
      color: var(--muted);
      margin-bottom: 10px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px 15px;
      border-radius: 14px;
      border: 1px solid rgba(217, 156, 173, 0.2);
      background: rgba(255, 252, 253, 0.98);
      color: var(--text);
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(217, 156, 173, 0.10);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
    }

    .message.success {
      background: rgba(67, 160, 71, 0.10);
      color: #2f7a33;
      display: none;
    }

    .contact-box {
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(217, 156, 173, 0.12);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 30px;
      display: grid;
      gap: 10px;
      text-align: center;
    }

    .contact-box p {
      color: var(--muted);
    }

    footer {
      margin-top: 30px;
      padding: 24px 0;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid rgba(217, 156, 173, 0.12);
      background: rgba(255,255,255,0.4);
    }

    .floating-whatsapp {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 998;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #25d366, #1faa52);
      box-shadow: 0 12px 28px rgba(37, 211, 102, 0.28);
      font-size: 26px;
    }

    @media (max-width: 980px) {
      .stats,
      .booking {
        grid-template-columns: 1fr;
      }

      .g1, .g2, .g3, .g4, .g5 {
        grid-column: span 12;
      }
    }

    @media (max-width: 780px) {
      .menu-toggle {
        display: block;
      }

      nav ul {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 16px;
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.86);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      nav ul.show {
        display: flex;
      }

      .hero-inner {
        padding: 30px 20px;
      }

      .section {
        padding: 72px 0;
      }

      .hero-actions {
        flex-direction: column;
      }

      .hero-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div
